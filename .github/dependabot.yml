version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /cloud
    schedule:
      interval: weekly
    groups:
      bases:
        patterns: ['*']
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: oven/bun
        update-types: ['version-update:semver-major']
      - dependency-name: mcr.microsoft.com/playwright
        update-types: ['version-update:semver-major']
