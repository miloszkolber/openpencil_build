name: OpenPencil MCP image

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpencil-mcp-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/miloszkolber/openpencil-mcp

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build candidate
        run: |
          docker build --pull \
            --tag "$IMAGE:local" \
            --label "org.opencontainers.image.title=OpenPencil MCP bridge" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            mcp

      - name: Smoke-test candidate
        run: |
          docker run --rm "$IMAGE:local" bun test src/live.test.ts
          docker run --rm "$IMAGE:local" bun test src/cloud.test.ts
          docker run --rm "$IMAGE:local" bun test src/auth.test.ts
          mkdir -p "$RUNNER_TEMP/mcp-data"
          printf '%s\n' \
            '{"serverURL":"http://127.0.0.1:9","accessToken":"smoke","savedAt":"2026-01-01T00:00:00.000Z"}' \
            > "$RUNNER_TEMP/mcp-data/cloud.json"
          chmod 644 "$RUNNER_TEMP/mcp-data/cloud.json"
          docker run -d --name openpencil-mcp-smoke \
            --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:18793:8790 \
            -v "$RUNNER_TEMP/mcp-data:/data:ro" \
            -e OPENPENCIL_MCP_TOKEN=smoke \
            -e OPENPENCIL_CLOUD_URL=http://127.0.0.1:9 \
            "$IMAGE:local"
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18793/health >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs openpencil-mcp-smoke; exit 1; fi
          curl -fsS http://127.0.0.1:18793/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18793/mcp)" = 401
          docker rm -f openpencil-mcp-smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish checked image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:local" "$IMAGE:latest"
          docker tag "$IMAGE:local" "$IMAGE:0.1.0"
          docker tag "$IMAGE:local" "$IMAGE:sha-${GITHUB_SHA:0:12}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:0.1.0"
          docker push "$IMAGE:sha-${GITHUB_SHA:0:12}"

      - name: Verify anonymous pull
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION: 0.1.0
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE:$VERSION"
