schema_version = 2

[deployment]
mode = "self-hosted"
public_url = "http://127.0.0.1:18787"
indexing = "deny"
local_editor = true

[database]

[authentication.enrollment]
mode = "closed"
notification_emails = []

[authentication.mfa]
required_for_admins = false
totp = false
recovery_codes = false
trusted_device_lifetime_days = 14

[authentication.passkeys]
enabled = false
rp_name = "OpenPencil Cloud"

[authentication.email_password]
enabled = false
sign_up = false
minimum_password_length = 8
maximum_password_length = 128
verification_link_lifetime_minutes = 60
password_reset_link_lifetime_minutes = 60
compromised_password_check = false

[authentication.trusted_proxies]
headers = []
addresses = []

[object_storage]
endpoint = "http://127.0.0.1:8333"
region = "us-east-1"
bucket = "openpencil"
force_path_style = true
checksum_verification = "metadata"
maximum_upload_bytes = 1073741824

[collaboration]
maximum_message_bytes = 1048576
maximum_connections_per_room = 1000

[documents]
retention_days = 30

[email]
transport = "none"

[workers.email]
batch_size = 50
interval_ms = 5000
lease_ms = 300000
maximum_attempts = 5

[workers.cleanup]
enabled = false
batch_size = 100
interval_ms = 60000
lease_ms = 300000

[entitlements]
source = "static"

[entitlements.documents]
maximum_file_bytes = 1073741824
revision_history = true

[entitlements.storage]
maximum_bytes = 1099511627776

[entitlements.sharing]
links = true
guest_view = true
guest_edit = true
guest_presence = true

[entitlements.collaboration]
enabled = true
maximum_participants = 100
