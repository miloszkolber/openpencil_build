name: openpencil-cloud-smoke

services:
  openpencil:
    image: ${OPENPENCIL_CLOUD_IMAGE:?Set OPENPENCIL_CLOUD_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENPENCIL_CLOUD_CONFIG: /etc/openpencil/openpencil-cloud.toml
      DATABASE_URL: postgresql://openpencil:openpencil@postgres:5432/openpencil
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      S3_ACCESS_KEY_ID: openpencil
      S3_SECRET_ACCESS_KEY: openpencil-development-secret
    ports:
      - '127.0.0.1:18787:8787'
    volumes:
      - ./openpencil-cloud.toml:/etc/openpencil/openpencil-cloud.toml:ro

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    network_mode: service:openpencil
    depends_on:
      - openpencil
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8333']
      interval: 2s
      timeout: 3s
      retries: 30

  bucket:
    image: amazon/aws-cli:2.27.49
    network_mode: service:openpencil
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: openpencil
      AWS_SECRET_ACCESS_KEY: openpencil-development-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        aws --endpoint-url http://127.0.0.1:8333 s3api head-bucket --bucket openpencil
        || aws --endpoint-url http://127.0.0.1:8333 s3api create-bucket --bucket openpencil

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openpencil
      POSTGRES_USER: openpencil
      POSTGRES_PASSWORD: openpencil
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openpencil -d openpencil']
      interval: 2s
      timeout: 3s
      retries: 30
